<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Луна Kids 👶</title>
<style>
  html,body{height:100%;margin:0;background:#1a1025;font-family:monospace}
  #header{background:#2d1b4e;color:#e0b0ff;padding:10px;text-align:center;font-weight:bold;font-size:1.1em}
  #chat{height:calc(100% - 120px);overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
  .msg{max-width:80%;padding:8px 10px;border:1px solid #3a2a54;background:#25183a;color:#e0d0ff;white-space:pre-wrap}
  .msg.me{align-self:flex-end;background:#1b3a4e;border-color:#2a5a6a;color:#cfe8f5}
  .msg.sys{align-self:center;color:#9a8ab4;border:none;background:none;font-size:0.9em}
  #bar{height:56px;display:flex;gap:6px;padding:8px;box-sizing:border-box;background:#1a1025}
  #inp{flex:1;background:#25183a;border:1px solid #3a2a54;color:#e0d0ff;padding:8px;font-size:16px}
  #send{background:#2d1b4e;border:1px solid #4a3a64;color:#e0b0ff;padding:8px 14px}
</style>
</head>
<body>
<div id="header">👶 ДЕТСКИЙ РЕЖИМ ЛУНЫ (Безопасный)</div>
<div id="chat"></div>
<div id="bar">
  <input id="inp" autocomplete="off" placeholder="Спроси что-нибудь у Луны…">
  <button id="send">➤</button>
</div>
<script>
const chat=document.getElementById('chat'),inp=document.getElementById('inp');
// ВАЖНО: отдельный ключ для детей, чтобы не пересекаться с основным
let ws, token=localStorage.getItem('luna_kids_token')||'';
if(!token){token=prompt('Введи детский токен Луны:')||'';localStorage.setItem('luna_kids_token',token);}

function add(cls,text){
  const d=document.createElement('div');
  d.className='msg '+cls;
  d.textContent=text;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}

function connect(){
  ws=new WebSocket('ws://'+location.hostname+':8766'); // Порт 8766 для детей!
  ws.onopen=()=>ws.send(JSON.stringify({type:'auth',token}));
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.type==='auth_ok'){
      add('sys','🌙 Детская Луна на связи');
    } else if(m.type==='auth_fail'){
      add('sys','⛔ Неверный токен');
      localStorage.removeItem('luna_kids_token');
      const newToken=prompt('Введи правильный детский токен:')||'';
      if(newToken){
        token=newToken;
        localStorage.setItem('luna_kids_token',token);
        add('sys','🔄 Переподключение…');
        ws.close();
        setTimeout(connect,500);
      }
    } else if(m.type==='reply'){
      add('luna',m.text);
    } else if(m.type==='pending'){
      add('sys','⚠ '+m.summary+' — ответь да или нет');
    }
  };
  ws.onclose=()=>{
    add('sys','связь потеряна, реконнект…');
    setTimeout(connect,3000);
  };
}

function send(){
  const t=inp.value.trim();
  if(!t||!ws||ws.readyState!==1)return;
  add('me',t);
  ws.send(JSON.stringify({type:'text',text:t}));
  inp.value='';
  inp.focus();
}

document.getElementById('send').onclick=send;
inp.addEventListener('keydown',e=>{if(e.key==='Enter')send();});
connect();
</script>
</body>
</html>
